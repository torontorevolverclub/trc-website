# Deploys the site to Firebase Hosting whenever changes are pushed to main.
# Uses keyless sign-in (Workload Identity Federation): no stored deploy key.
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/320410494022/locations/global/workloadIdentityPools/github/providers/trc-repo
          service_account: github-deploy@trc-website-106a9.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx -y firebase-tools@latest deploy --only hosting --project trc-website-106a9 --non-interactive
